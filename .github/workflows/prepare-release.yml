name: prepare-release

# Step 1 of 2 in cutting a release.
#
#   prepare-release  (you dispatch)  → opens a "Release X.Y.Z" pull request
#   tag-and-release  (on merge)      → tags and publishes
#
# The pull request is the review gate. Everything in its diff is mechanical — a version bump and a
# CHANGELOG promotion — because the prose was already reviewed in the pull request that added it.
#
# All the rewriting lives in scripts/prepare-release.sh so it can be run and inspected locally:
#   ./scripts/prepare-release.sh patch

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      version:
        description: "Explicit version (overrides bump), e.g. 1.2.3 — leave blank to use bump"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the script checks for an existing tag

      - name: Bump version and promote the changelog
        id: prep
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            ./scripts/prepare-release.sh --version "${{ inputs.version }}"
          else
            ./scripts/prepare-release.sh "${{ inputs.bump }}"
          fi

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
          CURRENT: ${{ steps.prep.outputs.current }}
        run: |
          BRANCH="release/$VERSION"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          # `git add -A`, not a list of paths. prepare-release.sh rewrites the install snippets in
          # README.md, socketio/README.md and guide/ as well as the version and the changelog, and
          # an explicit list silently drops whatever it does not name — which it did: those four
          # files were rewritten and then discarded, so the release branch still advertised the
          # previous version. That is the exact failure the snippet rewriting was added to prevent.
          # check-docs.sh catches it, so nothing stale ships — instead every release pull request
          # failed its own CI until someone fixed it by hand.
          #
          # The script writes nothing outside the repository and makes no network calls, so there
          # is nothing -A could pick up that should not be committed.
          git add -A
          git commit -m "Release $VERSION

          Bump VERSION_NAME $CURRENT -> $VERSION and promote the CHANGELOG's
          Unreleased section. Merging this tags v$VERSION and publishes to
          Maven Central."
          git push -u origin "$BRANCH"

          # The release notes are exactly what release.yml will extract, so the pull request shows
          # the text that becomes the GitHub Release.
          NOTES="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { c = 1; next }
            c && /^## \[/          { exit }
            c                      { print }
          ' CHANGELOG.md)"

          gh pr create --base main --head "$BRANCH" \
            --title "Release $VERSION" \
            --body "$(cat <<EOF
          Bumps \`VERSION_NAME\` **$CURRENT → $VERSION** and promotes the CHANGELOG's Unreleased section.

          **Merging this publishes to Maven Central.** \`tag-and-release\` creates \`v$VERSION\` on merge,
          which runs the full gate and then publishes. Maven Central never accepts a re-publish of a
          version, so the merge is the point of no return.

          ## Release notes as they will appear

          $NOTES

          ---

          Generated by \`prepare-release.yml\` from \`scripts/prepare-release.sh\`.
          EOF
          )"
