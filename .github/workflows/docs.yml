name: docs

# Publishes the Dokka API reference to GitHub Pages on every release.
# Requires Settings → Pages → Source: GitHub Actions (enabled).
#
# Normally invoked by tag-and-release.yml through workflow_call.
#
# GitHub suppresses workflow triggers for events raised by GITHUB_TOKEN — its guard against
# recursive runs — and this workflow has now been caught by that twice:
#
#   `release: [published]`  never fired, because release.yml creates the Release with GITHUB_TOKEN.
#   `push: tags`            never fired either, once tag-and-release.yml started pushing the tag
#                           with the same token. Correct only for a hand-pushed tag.
#
# So the caller invokes it explicitly, exactly as it does release.yml. The `push: tags` trigger is
# kept for a tag pushed by a human, where it does fire.

on:
  workflow_call:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Must be the Dokka V2 task — the V1 helper "dokkaHtml" is disabled and emits nothing.
      - name: Generate API reference
        run: ./gradlew :socketio:dokkaGeneratePublicationHtml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: socketio/build/dokka/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
