name: docs

# Publishes the Dokka API reference to GitHub Pages on every release.
# Requires Settings → Pages → Source: GitHub Actions (enabled).
#
# Triggered by the TAG, not by `release: [published]`. release.yml creates the GitHub Release with
# the built-in GITHUB_TOKEN, and GitHub deliberately suppresses workflow triggers for events raised
# by that token — its guard against recursive runs. So a `release` trigger here can never fire from
# our own release; v0.0.1 published and this workflow never ran. The tag is the same signal and
# needs no extra credential.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Must be the Dokka V2 task — the V1 helper "dokkaHtml" is disabled and emits nothing.
      - name: Generate API reference
        run: ./gradlew :socketio:dokkaGeneratePublicationHtml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: socketio/build/dokka/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
