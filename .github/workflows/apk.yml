name: apk

# On-demand demo APK. Debug only: androidApp declares no signingConfig, so `assembleRelease`
# produces an APK that cannot be installed. To ship a release APK/AAB, add a signingConfig fed
# from KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets first.

on:
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "shared/**"
      - "socketio/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Name the artifact after the commit
        id: name
        run: echo "value=sockit-demo-debug-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
